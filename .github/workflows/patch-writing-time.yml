name: Restore Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore last good homepage
        run: |
          git show cbeee2bfb354fcddfc9ff7978e5f1a6632bb31ba:index.html > index.html

      - name: Commit restored homepage
        run: |
          if git diff --quiet; then
            echo "Homepage already restored"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore homepage after Writing Time layout issue"
          git push
