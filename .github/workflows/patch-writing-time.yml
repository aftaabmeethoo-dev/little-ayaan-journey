name: Patch Writing Time

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python -c "from pathlib import Path; import base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='AYAAN_WRITING_TIME_INSIDE_HERO_V2'; patch=base64.b64decode('').decode('utf-8'); i=s.lower().rfind('</body>'); p.write_text(s if marker in s else (s[:i]+patch+s[i:] if i>=0 else s+patch), encoding='utf-8')"
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place Writing Time inside homepage picture"
          git push
